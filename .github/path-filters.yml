# Filter names for real steps match steps/ directory names.
# `shared` means "retest every step that exists". Add a filter when a new
# steps/chNN-* directory lands. The chapter plan is .github/chapters.json.
shared:
  - "Cargo.toml"
  - "Cargo.lock"
  - ".github/scripts/**"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
  - ".github/chapters.json"
ch01-1-jsonrpc:
  - "steps/ch01-1-jsonrpc/**"
ch02-1-negotiate:
  - "steps/ch02-1-negotiate/**"
ch03-1-builder:
  - "steps/ch03-1-builder/**"
ch04-1-schema:
  - "steps/ch04-1-schema/**"
ch05-1-tool-macro:
  - "steps/ch05-1-tool-macro/**"
ch06-1-resources:
  - "steps/ch06-1-resources/**"
ch07-1-prompts:
  - "steps/ch07-1-prompts/**"
ch08-1-errors:
  - "steps/ch08-1-errors/**"
ch09-1-context:
  - "steps/ch09-1-context/**"
ch10-1-depends:
  - "steps/ch10-1-depends/**"
ch11-1-lifespan:
  - "steps/ch11-1-lifespan/**"
ch12-1-http:
  - "steps/ch12-1-http/**"
ch13-1-elicit:
  - "steps/ch13-1-elicit/**"
ch14-1-client:
  - "steps/ch14-1-client/**"
ch15-1-testing:
  - "steps/ch15-1-testing/**"
