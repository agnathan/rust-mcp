[package]
name = "ch24-1-fastmcp-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "fastmcp_core"

[dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-std", "sync", "time"] }
tokio-util = "0.7"
ch24-1-fastmcp-macros = { path = "../fastmcp-macros" }
rhai = "1.26.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["env", "json"] }

[dev-dependencies]
criterion = "0.5"
insta = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }

