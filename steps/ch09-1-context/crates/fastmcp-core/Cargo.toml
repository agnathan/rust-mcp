[package]
name = "ch09-1-fastmcp-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "fastmcp_core"

[dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
ch09-1-fastmcp-macros = { path = "../fastmcp-macros" }

[dev-dependencies]
criterion = "0.5"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }

[[bench]]
name = "jsonrpc"
harness = false

[[bench]]
name = "negotiate"
harness = false

[[bench]]
name = "tools"
harness = false

[[bench]]
name = "schema"
harness = false

[[bench]]
name = "macro_reg"
harness = false

[[bench]]
name = "resources"
harness = false

[[bench]]
name = "prompts"
harness = false

[[bench]]
name = "errors"
harness = false

[[bench]]
name = "context"
harness = false
